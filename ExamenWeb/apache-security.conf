# Endurecimiento global de Apache para las webs del laboratorio.
# Se copia a /etc/apache2/conf-enabled/ desde el Dockerfile.
#
# Corrige los hallazgos de DAST (ZAP) relacionados con cabeceras y cookies:
#   - Server Leaks Version Information  -> ServerTokens/ServerSignature
#   - X-Powered-By Information Leak     -> expose_php Off
#   - Missing CSP / anti-clickjacking   -> X-Frame-Options + CSP
#   - Missing nosniff / Referrer-Policy -> cabeceras añadidas
#   - Cookie No HttpOnly Flag           -> session.cookie_httponly
#   - Cookie without SameSite Attribute -> session.cookie_samesite

ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Las directivas de PHP (expose_php, cookies de sesión) se fijan en
# /usr/local/etc/php/conf.d/zz-security.ini desde el Dockerfile, porque
# expose_php es PHP_INI_SYSTEM y no admite php_flag.

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    # CSP permisiva a propósito: las plantillas usan estilos y scripts inline.
    # La mitigación real de XSS está en el escapado de salida (htmlspecialchars).
    Header always set Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
</IfModule>

# Directorios de subida: nunca ejecutar código servido desde ellos.
<Directory "/var/www/html/private/uploads">
    Options -Indexes -ExecCGI
    RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8
    RemoveType .php .phtml .phar
    <FilesMatch "\.(php|phtml|phar|php[0-9])$">
        Require all denied
    </FilesMatch>
    <IfModule mod_php.c>
        php_flag engine off
    </IfModule>
</Directory>

<Directory "/var/www/html/management/uploads">
    Options -Indexes -ExecCGI
    RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8
    RemoveType .php .phtml .phar
    <FilesMatch "\.(php|phtml|phar|php[0-9])$">
        Require all denied
    </FilesMatch>
    <IfModule mod_php.c>
        php_flag engine off
    </IfModule>
</Directory>
